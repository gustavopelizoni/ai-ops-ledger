[project]
name = "ai-operations-room"
version = "0.1.0"
description = "Local operations room for AI coding sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    "jsonschema>=4.21,<5",
    "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["backend", "agent", "skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
