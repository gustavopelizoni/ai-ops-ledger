[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-ledger"
version = "0.1.0"
description = "Static, local-LLM auditor for public AI-agent repositories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "skills*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
